<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>해빗 타워</title>
<meta name="theme-color" content="#2a2a2a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="해빗 타워">
<style>
@font-face { font-family: Galmuri11; src: url(fonts/Galmuri11.woff2) format('woff2'); font-display: swap; }
:root {
  --frame:#3a3a3a; --frame-dark:#1a1a1a; --title:#e8c85a; --paper:#f4f1e6; --line:#c8c0a4;
  --ink:#333; --muted:#888; --gold:#ffd24a; --outline:#2b1d14;
  --b-green:linear-gradient(#8fd35a,#4a9a12); --b-blue:linear-gradient(#7cc0f5,#2f7fce); --b-orange:linear-gradient(#ffcf6a,#f08c10);
  --sky:linear-gradient(#8fc3ea,#cfe8f7); --grass:linear-gradient(#9bcf7a,#6fae4f);
  --bw: 120px; --bh: 60px; /* one photo brick */
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --sky:linear-gradient(#1d2b45,#2c3f5e); --grass:linear-gradient(#2f4a2a,#223820); } }
:root[data-theme="dark"] { --sky:linear-gradient(#1d2b45,#2c3f5e); --grass:linear-gradient(#2f4a2a,#223820); }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100vh; background: var(--sky); background-attachment: fixed;
  font-family: Galmuri11, 'Dotum', '돋움', sans-serif; font-size: 12px; color: var(--ink); }
#app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
button { font: inherit; cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
.banner { background: #b8482c; color: #fff; text-align: center; padding: 6px; }
.muted { color: var(--muted); } .small { font-size: 11px; } .gold { color: var(--gold); font-weight: bold; }
.center { text-align: center; } .empty { color: var(--muted); text-align: center; padding: 20px; }

/* HUD + bottom bar */
.hud, .bar { display: flex; align-items: center; gap: 8px; padding: 6px 16px; color: #fff;
  background: linear-gradient(#4a4a4a,#2a2a2a); border-color: #777; border-style: solid; border-width: 0; }
.hud { justify-content: space-between; border-bottom-width: 2px; }
.hud .ttlbox { display: flex; gap: 10px; align-items: baseline; min-width: 0; }
.hud .ttlbox b { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hud > span { display: flex; gap: 4px; flex: none; }
.bar { justify-content: center; border-top-width: 2px; min-height: 52px; padding-bottom: calc(6px + env(safe-area-inset-bottom)); } /* iPhone home bar */
.hud { padding-top: calc(6px + env(safe-area-inset-top)); }
.done { color: #9bf07a; font-weight: bold; font-size: 14px; }

.btn { color: #fff; border-radius: 3px; padding: 2px 8px; font-weight: bold; border: 1px solid; white-space: nowrap; display: inline-block; }
.btn.green { background: var(--b-green); border-color: #2f6a08; } .btn.blue { background: var(--b-blue); border-color: #1d5a99; }
.btn.orange { background: var(--b-orange); border-color: #b36200; }
.btn.big { font-size: 15px; padding: 8px 20px; border-radius: 6px; box-shadow: 0 3px 0 #2f6a08; }
label.btn { cursor: pointer; } label.btn.off { opacity: .5; cursor: default; }
.btn:focus-within, .btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

/* Scene: crew + tower standing on the ground; the stage scrolls when the tower outgrows the screen */
.stage { flex: 1; position: relative; overflow-x: hidden; overflow-y: auto; }
.world { min-height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-top: 56px; }
.ground { align-self: stretch; flex: none; height: max(48px, 9vh); background: var(--grass); border-top: 2px solid #3f6e2c; }
.scene { --fd: .6s; position: relative; display: flex; align-items: flex-end; gap: 14px; padding: 0 16px; }
.crew { position: relative; display: flex; align-items: flex-end; gap: 2px; }
.crew svg { display: block; }
.crew .mob svg { transform: scaleX(-1); } /* monster art faces left; here it follows the hero */
.hero, .mob { animation: breathe 1.6s ease-in-out infinite; }
.mob { animation-delay: .4s; }
@keyframes breathe { 50% { transform: translateY(-2px); } }
.carried { display: none; position: absolute; left: 50%; margin-left: calc(var(--bw) / -2); bottom: calc(100% - 4px); }
.stars { display: none; position: absolute; left: 0; right: 0; top: -22px; text-align: center; color: #ffe14d; font-size: 14px; text-shadow: 0 1px 0 #000; }

.tower { position: relative; display: flex; flex-direction: column; align-items: center; min-width: calc(var(--bw) + 2px); }
.stack { display: flex; flex-direction: column-reverse; align-items: center; }
/* Photo brick: the proof photo framed in the floor's color, with pixel bevel on top */
.blk, .carried { width: var(--bw); height: var(--bh); padding: 0; background: var(--c); border: 3px solid var(--c);
  box-shadow: 0 0 0 1px var(--outline); overflow: hidden; }
.blk { display: block; position: relative; margin-top: 1px; }
.blk img, .carried img { display: block; width: 100%; height: 100%; object-fit: cover; }
.blk::after, .carried::after { content: ''; position: absolute; inset: 0; box-shadow: inset 2px 2px rgba(255,255,255,.35), inset -2px -2px rgba(0,0,0,.3); pointer-events: none; }
.blk:hover, .blk:focus-visible { filter: brightness(1.15); outline: 2px solid #fff; outline-offset: 1px; }
.base { width: calc(var(--bw) + 18px); height: 6px; background: #5a3a22; border: 1px solid var(--outline); border-radius: 2px; }
.flag { font-size: 22px; line-height: 1; position: relative; }
.rubble { display: flex; align-items: flex-end; }
.rubble i { width: 14px; height: 8px; margin: 0 -1px; background: #a7a7a7; border: 1px solid var(--outline); }
.rubble i:nth-child(2n) { transform: rotate(18deg); } .rubble i:nth-child(3) { transform: translateY(-6px) rotate(-12deg); }
.plus, .dust { display: none; }

/* Stack (~3-4s): crew walks in bobbing with one brick overhead, crouches, jumps and tosses at the peak (1.4s);
   the brick flies a real parabola from exactly where it was held (--fx/--fy/--fs set in scene.js) and lands after --fd. */
.stacking .crew { transform-origin: 50% 100%; animation: carry 1.65s both, cheer .4s ease-out calc(1.45s + var(--fd)); }
.stacking .hero, .stacking .mob, .stacking .carried { animation: bob .275s ease-in-out 4 alternate; }
.stacking .mob { animation-delay: .14s; }
.stacking .carried { display: block; animation: bob .275s ease-in-out 4 alternate, vanish 0s 1.4s forwards; }
.stacking .blk.new { animation: appear 0s 1.4s both, fly var(--fd) linear 1.4s both, land .28s ease-out calc(1.4s + var(--fd)); }
.stacking .stack { transform-origin: 50% 100%; animation: settle .35s ease-out calc(1.4s + var(--fd)); }
.stacking .dust { display: block; position: absolute; top: -8px; width: 80px; height: 18px; border-radius: 50%;
  background: radial-gradient(#fffa, transparent 70%); animation: puff .6s ease-out calc(1.4s + var(--fd)) both; }
.stacking .plus { display: block; position: absolute; top: -26px; color: #ffe14d; font-weight: bold; font-size: 14px;
  text-shadow: -1px 0 #000, 1px 0 #000, 0 -1px #000, 0 1px #000; animation: rise .9s ease-out calc(1.45s + var(--fd)) both; }
@keyframes carry {
  0% { transform: translateX(-60vw) rotate(4deg); animation-timing-function: cubic-bezier(.3,.5,.4,1); }
  67% { transform: translateX(0) rotate(2deg); animation-timing-function: ease-out; }
  76% { transform: translateY(3px) scale(1.06,.9); animation-timing-function: cubic-bezier(.2,.8,.4,1); }
  85% { transform: translateY(-20px) scale(.96,1.06); animation-timing-function: cubic-bezier(.6,0,.8,.4); }
  94% { transform: translateY(2px) scale(1.06,.92); animation-timing-function: ease-out; }
  100% { transform: none; } }
@keyframes cheer { 40% { transform: translateY(-10px); } }
@keyframes bob { to { transform: translateY(-4px); } }
@keyframes vanish { to { visibility: hidden; } }
/* x linear; y climbs fast then slows like a real throw ((1-t)^2) plus a 70px arc; dense stops + linear timing trace the curve */
@keyframes fly {
  0% { transform: translate(var(--fx), var(--fy)) scale(var(--fs)); }
  20% { transform: translate(calc(var(--fx) * .8), calc(var(--fy) * .64 - 70px * .64)) rotate(-8deg) scale(calc(var(--fs) + (1 - var(--fs)) * .2)); }
  40% { transform: translate(calc(var(--fx) * .6), calc(var(--fy) * .36 - 70px * .96)) rotate(-14deg) scale(calc(var(--fs) + (1 - var(--fs)) * .4)); }
  50% { transform: translate(calc(var(--fx) * .5), calc(var(--fy) * .25 - 70px)) rotate(-15deg) scale(calc(var(--fs) + (1 - var(--fs)) * .5)); }
  60% { transform: translate(calc(var(--fx) * .4), calc(var(--fy) * .16 - 70px * .96)) rotate(-12deg) scale(calc(var(--fs) + (1 - var(--fs)) * .6)); }
  80% { transform: translate(calc(var(--fx) * .2), calc(var(--fy) * .04 - 70px * .64)) rotate(-6deg) scale(calc(var(--fs) + (1 - var(--fs)) * .8)); }
  100% { transform: none; } }
@keyframes land { 35% { transform: scale(1.1,.7); } 70% { transform: scale(.97,1.08); } }
@keyframes settle { 35% { transform: scaleY(.985); } 70% { transform: scaleY(1.004); } }
@keyframes puff { 0% { opacity: 0; transform: scale(.4); } 30% { opacity: 1; } 100% { opacity: 0; transform: scale(1.5); } }
@keyframes rise { 0% { opacity: 0; transform: translateY(8px); } 25% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-16px); } }
/* 30th floor: sparks burst around the flag */
.stacking .flag { animation: appear 0s calc(1.4s + var(--fd)) both; } /* flag goes up when the 30th brick lands */
@keyframes appear { from { visibility: hidden; } }
.sparks { position: absolute; left: 50%; top: 50%; }
.sparks i { position: absolute; width: 5px; height: 5px; background: #ffe14d; box-shadow: 0 0 4px #fff; animation: spark .8s ease-out calc(1.4s + var(--fd)) both; }
.sparks i:nth-child(odd) { background: #ff7a5c; }
@keyframes spark { 0% { opacity: 1; transform: rotate(var(--a)) translateX(0); } 100% { opacity: 0; transform: rotate(var(--a)) translateX(50px); } }

/* Collapse: tower shakes, each floor tumbles to the ground, crew sees stars (2.6s) */
.falling .stack { animation: shake .5s; }
.blk.fall { animation: fall .9s cubic-bezier(.5,0,.9,.6) calc(.5s + var(--delay)) both; }
.falling .stars { display: block; animation: appear 0s 1.2s both, spin 1s linear 1.2s infinite; } /* stars once the crew is hit */
.falling .hero, .falling .mob { animation: dazed .4s ease-out 1.2s both; }
@keyframes shake { 20%, 60% { transform: translateX(-4px) rotate(-1deg); } 40%, 80% { transform: translateX(4px) rotate(1deg); } }
@keyframes fall { to { transform: translate(var(--dx), calc((var(--bh) + 1px) * var(--i) - var(--pile))) rotate(var(--rot)); } } /* 1px = brick gap */
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes dazed { to { transform: rotate(-14deg) translateY(2px); } }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }

/* Windows */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
.win { background: var(--frame); border: 1px solid var(--frame-dark); border-radius: 5px; padding: 3px; box-shadow: 0 2px 8px rgba(0,0,0,.5);
  display: flex; flex-direction: column; width: 100%; max-height: 100%; }
.setup-win { max-width: 330px; } .photo-win { max-width: 560px; } .album-win { max-width: 560px; } .fall-win { max-width: 300px; }
.ttl { color: var(--title); font-weight: bold; font-size: 11px; text-align: center; padding: 1px 0 3px; position: relative; }
.ttl .x { position: absolute; right: 2px; top: -2px; background: none; border: 0; color: #ddd; }
.body { background: var(--paper); border: 1px solid #888; overflow-y: auto; }
.pad { padding: 10px 12px; line-height: 1.7; } .pad p { margin: 6px 0 0; }
.foot { display: flex; justify-content: space-between; padding: 6px 0 0; }
.win > .foot { padding: 4px; }
label, .lbl { display: block; margin-bottom: 8px; font-weight: bold; }
input:not([type=file]) { display: block; width: 100%; margin-top: 3px; font: inherit; border: 1px solid #9a9a9a; background: #fffdf5; padding: 4px 6px; color: var(--ink); }
.chars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.char { background: #fff; border: 2px solid #3a3a3a; border-radius: 6px; padding: 4px 0; display: flex; flex-direction: column; align-items: center; }
.char.sel { border-color: #f39a1e; box-shadow: 0 0 0 3px #ffd27a; }
.photo-win img { display: block; width: 100%; max-height: 75vh; object-fit: contain; background: #222; }
.big { font-size: 15px; font-weight: bold; }
.album { padding: 8px 10px; max-height: 75vh; }
.album section + section { margin-top: 12px; border-top: 1px dotted var(--line); padding-top: 8px; }
.album h3 { font-size: 12px; margin: 0 0 6px; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 4px; }
.thumbs button { position: relative; padding: 0; border: 1px solid var(--line); background: #ddd; aspect-ratio: 1; overflow: hidden; }
.thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumbs span { position: absolute; left: 2px; bottom: 1px; color: #fff; font-size: 10px; text-shadow: 0 0 2px #000; }
.backup { margin-top: 10px; border-top: 1px dotted var(--line); padding-top: 8px; }
.backup > span { display: flex; gap: 6px; flex-wrap: wrap; }
.btn.danger { background: linear-gradient(#e0795a,#b8482c); border-color: #7a2a14; }
.wipe { margin-top: 8px; padding: 6px 8px; background: #fbe3dc; border: 1px solid #d9937f; border-radius: 3px; } .wipe p { margin: 0 0 6px; }
.toast { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); background: #2a2a2a; color: #fff; padding: 6px 12px; border-radius: 4px; z-index: 30; }
/* Couple mode */
.tabs { display: flex; background: #2a2a2a; border-bottom: 2px solid #777; }
.tabs button { flex: 1; min-width: 0; background: none; border: 0; color: #bbb; padding: 6px 4px; font-weight: bold;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--gold); box-shadow: inset 0 -3px var(--gold); }
.blk img.half, .carried img.half { float: left; width: 50%; }
.blk .wait, .carried .wait { float: left; width: 50%; height: 100%; display: grid; place-items: center; font-style: normal; font-weight: bold;
  color: #fff; background: rgba(0,0,0,.28); outline: 2px dashed rgba(255,255,255,.85); outline-offset: -3px; text-shadow: 0 1px 0 #000; }
.halfblk:not(.new) .wait { animation: breathe 1.6s ease-in-out infinite; }
.duo { display: flex; } .duo figure { margin: 0; flex: 1; min-width: 0; }
.duo figcaption { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px; text-align: center; }
.duo input.note { text-align: center; margin: 0; } .said { font-style: italic; overflow-wrap: anywhere; }
.reacts button { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 2px 8px; margin: 0 2px; font-size: 16px; }
.reacts button.on { border-color: #f39a1e; box-shadow: 0 0 0 2px #ffd27a; }
.blk .badge { position: absolute; bottom: 1px; font-size: 13px; line-height: 1; filter: drop-shadow(0 0 1px #fff); }
.blk .badge.l { left: 2px; } .blk .badge.r { right: 2px; }
.couple > span { align-items: center; margin-bottom: 6px; } .couple input { width: auto; flex: 1; min-width: 0; margin: 0; }
.couple input.code { text-transform: uppercase; max-width: 90px; }
.invite { font-size: 18px; letter-spacing: 3px; color: #b36200; }
.cal-win { max-width: 420px; }
.cal-head { display: flex; justify-content: space-between; align-items: center; }
.cal-sum { text-align: center; margin: 4px 0 8px !important; font-weight: bold; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal-w { text-align: center; font-size: 11px; color: var(--muted); }
.cal-day { position: relative; display: block; aspect-ratio: 1; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: #fff; overflow: hidden; }
.cal-day.empty { border: 0; background: none; } .cal-day.future { opacity: .45; } .cal-day.today { box-shadow: 0 0 0 2px #f39a1e; }
.cal-day img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cal-day img.half { width: 50%; } .cal-day img.half.r { left: 50%; }
.cal-day b { position: absolute; left: 2px; top: 1px; font-size: 10px; color: var(--ink); text-shadow: 0 0 2px #fff, 0 0 2px #fff; }
.cal-day .shield { position: absolute; inset: 0; display: grid; place-items: center; font-style: normal; font-size: 16px; }
.cal-day .dot { position: absolute; bottom: 4px; }
.cal-day .dot.l { left: 22%; } .cal-day .dot.r { right: 22%; }
.cal-win .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; }
.cal-win .dot.l { background: #4a9a12; } .cal-win .dot.r { background: #b04ad9; }
.cal-key { text-align: center; margin: -4px 0 8px !important; }
.trophies { background: none; border: 0; color: #fff; padding: 0; text-decoration: underline dotted; }
.shelf section + section { margin-top: 8px; padding-top: 8px; }
.shelf .collage { margin: 0 0 6px; text-align: center; }
.trophy { display: flex; align-items: center; gap: 10px; width: 100%; background: #fff; border: 2px solid #3a3a3a; border-radius: 6px; padding: 6px; text-align: left; margin-bottom: 6px; }
.trophy .mini { display: flex; flex-direction: column-reverse; align-items: center; width: 22px; font-size: 12px; line-height: 1; }
.trophy .mini i { display: block; width: 18px; height: 3px; margin-top: 1px; box-shadow: 0 0 0 1px var(--outline); }
.trophy img { width: 72px; height: 54px; object-fit: cover; border: 2px solid #f2c230; }
.trophy .info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.reward { background: #3a2f18; color: var(--gold); text-align: center; padding: 4px 16px; font-weight: bold;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Rewards: bag, collection book, box reveal */
.hero { position: relative; }
.nametag { position: absolute; left: 50%; top: calc(100% + 4px); transform: translateX(-50%); z-index: 1; font-size: 10px; color: #2b1d14; white-space: nowrap;
  background: linear-gradient(#ffe89a,#f2c230); border: 1px solid #8a6a10; border-radius: 8px; padding: 0 6px; }
.hud .gold { white-space: nowrap; }
.hud .mute { padding: 2px 4px; }
@media (max-width: 400px) { .hud { padding-left: 10px; padding-right: 10px; gap: 6px; } .hud .ttlbox { gap: 6px; } .hud .btn.sm { padding: 2px 5px; } .hud > span { gap: 3px; } }
select.track { display: block; margin-top: 6px; font: inherit; border: 1px solid #9a9a9a; background: #fffdf5; padding: 3px 4px; color: var(--ink); }
.bag-win { max-width: 440px; height: 100%; max-height: 640px; } .reveal-win { max-width: 300px; }
.bag-win .tabs { border-radius: 3px 3px 0 0; }
.bag { flex: 1; min-height: 0; }
.bag h3 { font-size: 12px; margin: 10px 0 4px; } .bag section:first-of-type h3 { margin-top: 4px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 4px; }
.cell { position: relative; display: grid; place-items: center; aspect-ratio: 1; padding: 2px; background: #fff;
  border: 2px solid var(--tc, #999); border-radius: 6px; overflow: hidden; }
.cell.sel { box-shadow: 0 0 0 3px #ffd27a; border-color: #f39a1e; }
.cell.unknown { background: #e9e5d6; border-style: dashed; }
.cell.unknown img { filter: brightness(0); opacity: .18; }
.cell .star { position: absolute; right: 1px; top: 0; font-style: normal; font-size: 10px; }
.cell .lbl { position: absolute; bottom: 1px; font-style: normal; font-size: 9px; color: var(--muted); }
.cell .q { font-style: normal; font-size: 18px; color: #b8b09a; }
.pix { width: 40px; height: 40px; image-rendering: pixelated; display: block; }
.swatch { display: flex; flex-direction: column; justify-content: flex-end; width: 38px; height: 34px; border: 1px solid var(--outline); border-radius: 3px; overflow: hidden; }
.swatch i { display: block; height: 30%; }
.bricks { display: flex; flex-direction: column; gap: 1px; } .bricks i { display: block; width: 30px; height: 9px; box-shadow: 0 0 0 1px var(--outline); }
.flagicon { font-style: normal; font-size: 24px; }
.tier { display: inline-block; color: #fff; font-size: 10px; font-weight: bold; padding: 0 6px; border-radius: 8px; text-shadow: 0 1px 0 #0006; }
.shiny-chip { background: linear-gradient(90deg,#ff7ab0,#ffd84a,#6ad0ff); }
.dexsum { font-weight: bold; margin: 0 !important; } .picked { margin: 4px 0 0 !important; }
.duo-h { margin-top: 14px !important; border-top: 1px dotted var(--line); padding-top: 8px; }
.titles { display: flex; flex-direction: column; gap: 4px; }
.trow { display: flex; flex-direction: column; align-items: flex-start; text-align: left; background: #fff; border: 2px solid #3a3a3a; border-radius: 6px; padding: 4px 8px; }
.trow.sel { border-color: #f39a1e; box-shadow: 0 0 0 3px #ffd27a; } .trow:disabled { background: #eee; }
.shardbar { height: 8px; margin: 10px auto 2px; max-width: 220px; background: #ddd6c0; border: 1px solid var(--outline); border-radius: 4px; overflow: hidden; }
.shardbar i { display: block; height: 100%; background: linear-gradient(90deg,#8fd35a,#f2c230); }
.chestwrap { position: relative; display: grid; place-items: center; width: 180px; height: 130px; margin: 4px auto; --gc: #fff; }
